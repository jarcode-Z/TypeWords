server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-host asset mirrors (must not fall through to SPA)
    location ^~ /files/ {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /libs/ {
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /200.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
